spring.application.name=exam
server.port=${SERVER_PORT:8081}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/englishexamapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql: true

jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

google.speech.language-code=${GOOGLE_SPEECH_LANGUAGE_CODE:en-US}
google.speech.audio-encoding=${GOOGLE_SPEECH_AUDIO_ENCODING:ENCODING_UNSPECIFIED}
google.speech.sample-rate-hertz=${GOOGLE_SPEECH_SAMPLE_RATE_HERTZ:0}
ai.mock-enabled=${AI_MOCK_ENABLED:true}

payment.mock-enabled=${PAYMENT_MOCK_ENABLED:false}
momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.create-url=${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:}
momo.ipn-url=${MOMO_IPN_URL:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
