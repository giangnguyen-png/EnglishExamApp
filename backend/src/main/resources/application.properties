spring.application.name=exam
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/englishexamapp
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql: true

# Development fallback only. Use JWT_SECRET in real environments.
# This secret signs and validates HS256 JWT access tokens.
jwt.secret=${JWT_SECRET:dev-secret-for-local-jwt-signing-change-me-32-bytes}
jwt.access-token-expiration-minutes=60

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

google.speech.language-code=${GOOGLE_SPEECH_LANGUAGE_CODE:en-US}
google.speech.audio-encoding=${GOOGLE_SPEECH_AUDIO_ENCODING:ENCODING_UNSPECIFIED}
google.speech.sample-rate-hertz=${GOOGLE_SPEECH_SAMPLE_RATE_HERTZ:0}
ai.mock-enabled=true

payment.mock-enabled=false
momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
