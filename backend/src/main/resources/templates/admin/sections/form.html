<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${formTitle}">Biểu mẫu phần thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar(${formTitle})}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4">
          <div class="mb-3">
            <div class="text-muted small">Đề thi</div>
            <div class="fw-semibold" th:text="${exam.title}">Đề thi</div>
          </div>
          <form th:action="${actionUrl}" th:object="${sectionForm}" method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="skillType">Kỹ năng</label>
                <select class="form-select" id="skillType" th:field="*{skillType}" required>
                  <option th:each="skill : ${skillTypes}" th:value="${skill}" th:text="${skill}">READING</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="sectionOrder">Thứ tự phần thi</label>
                <input class="form-control" id="sectionOrder" type="number" th:field="*{sectionOrder}" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="mediaUrl">URL media</label>
                <input class="form-control" id="mediaUrl" th:field="*{mediaUrl}" placeholder="URL audio Listening hoặc media liên quan">
              </div>
              <div class="col-12">
                <label class="form-label" for="passageContent">Nội dung đoạn văn</label>
                <textarea class="form-control" id="passageContent" rows="7" th:field="*{passageContent}"></textarea>
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button class="btn btn-primary" type="submit">Lưu</button>
              <a class="btn btn-outline-secondary" th:href="@{/admin/exams/{id}(id=${exam.id})}">Hủy</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
