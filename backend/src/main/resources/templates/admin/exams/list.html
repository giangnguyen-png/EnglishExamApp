<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đề thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Đề thi')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Quản lý đề thi</h2>
            <a class="btn btn-primary" th:href="@{/admin/exams/new}">Tạo đề thi</a>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tiêu đề</th>
                  <th>Loại</th>
                  <th>Phần thi</th>
                  <th>Ngày tạo</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="exam : ${exams}">
                  <td th:text="${exam.id}">1</td>
                  <td th:text="${exam.title}">Đề thi</td>
                  <td>
                    <span class="badge" th:classappend="${exam.premiumOnly} ? 'text-bg-primary' : 'text-bg-secondary'" th:text="${exam.premiumOnly ? 'Premium' : 'Thường'}">Thường</span>
                  </td>
                  <td th:text="${exam.examSections != null ? exam.examSections.size() : 0}">0</td>
                  <td th:text="${exam.createdAt != null ? #temporals.format(exam.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                  <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/exams/{id}(id=${exam.id})}">Xem</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/exams/{id}/edit(id=${exam.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/admin/exams/{id}/delete(id=${exam.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa đề thi này?');">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(exams)}">
                  <td colspan="6" class="text-center text-muted">Không có đề thi.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
