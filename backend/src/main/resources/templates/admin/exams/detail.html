<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết đề thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Chi tiết đề thi')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
              <h2 class="h4 mb-1" th:text="${exam.title}">Đề thi</h2>
              <p class="text-muted mb-2" th:text="${exam.description}">Mô tả</p>
              <span class="badge" th:classappend="${exam.premiumOnly} ? 'text-bg-primary' : 'text-bg-secondary'" th:text="${exam.premiumOnly ? 'Premium' : 'Thường'}">Thường</span>
            </div>
            <div class="d-flex gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/admin/exams}">Quay lại</a>
              <a class="btn btn-primary" th:href="@{/admin/exams/{id}/edit(id=${exam.id})}">Sửa</a>
            </div>
          </div>
        </section>

        <section class="admin-card p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h5 mb-0">Phần thi</h3>
            <a class="btn btn-primary" th:href="@{/admin/exams/{id}/sections/new(id=${exam.id})}">Thêm phần thi</a>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Kỹ năng</th>
                  <th>Thứ tự</th>
                  <th>URL media</th>
                  <th>Câu hỏi</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="section : ${sections}">
                  <td th:text="${section.id}">1</td>
                  <td><span class="badge text-bg-info" th:text="${section.skillType}">READING</span></td>
                  <td th:text="${section.sectionOrder}">1</td>
                  <td class="text-truncate" style="max-width: 260px;" th:text="${section.mediaUrl ?: '-'}">-</td>
                  <td th:text="${section.questions != null ? section.questions.size() : 0}">0</td>
                  <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/sections/{id}/questions(id=${section.id})}">Quản lý câu hỏi</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/sections/{id}/edit(id=${section.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/admin/sections/{id}/delete(id=${section.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa phần thi này?');">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(sections)}">
                  <td colspan="6" class="text-center text-muted">Không có phần thi.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
