<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${formTitle}">Biểu mẫu đề thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar(${formTitle})}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4">
          <form th:action="${actionUrl}" th:object="${examForm}" method="post">
            <div class="mb-3">
              <label class="form-label" for="title">Tiêu đề</label>
              <input class="form-control" id="title" th:field="*{title}" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="description">Mô tả</label>
              <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" id="premiumOnly" type="checkbox" th:field="*{premiumOnly}">
              <label class="form-check-label" for="premiumOnly">Chỉ dành cho Premium</label>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Lưu</button>
              <a class="btn btn-outline-secondary" th:href="@{/admin/exams}">Hủy</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
