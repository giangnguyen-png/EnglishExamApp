<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${formTitle}">Biểu mẫu đáp án</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar(${formTitle})}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4">
          <div class="mb-3">
            <div class="text-muted small">Câu hỏi</div>
            <div class="fw-semibold text-truncate" th:text="${question.content}">Câu hỏi</div>
          </div>
          <form th:action="${actionUrl}" th:object="${answerForm}" method="post">
            <div class="mb-3">
              <label class="form-label" for="content">Nội dung đáp án</label>
              <textarea class="form-control" id="content" rows="4" th:field="*{content}" required></textarea>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" id="correct" type="checkbox" th:field="*{correct}">
              <label class="form-check-label" for="correct">Đáp án đúng</label>
            </div>
            <div class="mb-4">
              <label class="form-label" for="explanation">Giải thích đáp án</label>
              <textarea class="form-control" id="explanation" rows="4" th:field="*{explanation}"></textarea>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Lưu</button>
              <a class="btn btn-outline-secondary" th:href="@{/admin/questions/{id}(id=${question.id})}">Hủy</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
