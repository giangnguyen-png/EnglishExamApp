<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết câu hỏi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Chi tiết câu hỏi')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <div>
              <span class="badge text-bg-secondary" th:text="${question.questionType}">SINGLE_CHOICE</span>
              <span class="badge text-bg-light text-dark">Thứ tự <span th:text="${question.orderIndex}">1</span></span>
            </div>
            <div class="d-flex gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/admin/sections/{id}/questions(id=${question.examSection.id})}">Quay lại</a>
              <a class="btn btn-primary" th:href="@{/admin/questions/{id}/edit(id=${question.id})}">Sửa</a>
            </div>
          </div>
          <p class="mb-3" th:text="${question.content}">Nội dung câu hỏi</p>
          <img class="img-fluid rounded border" style="max-height: 240px;" th:if="${question.imageUrl}" th:src="${question.imageUrl}" alt="Hình câu hỏi">
          <dl class="row mt-3 mb-0">
            <dt class="col-sm-3">Điểm</dt><dd class="col-sm-9" th:text="${question.points}">1</dd>
            <dt class="col-sm-3">Tổng thời gian câu hỏi</dt><dd class="col-sm-9" th:text="${question.durationSeconds ?: '-'}">-</dd>
            <dt class="col-sm-3">Thời gian chuẩn bị</dt><dd class="col-sm-9" th:text="${question.preparationSeconds ?: '-'}">-</dd>
          </dl>
        </section>

        <section class="admin-card p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Đáp án</h2>
            <a class="btn btn-primary" th:if="${canUseAnswers}" th:href="@{/admin/questions/{id}/answers/new(id=${question.id})}">Thêm đáp án</a>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nội dung</th>
                  <th>Đáp án đúng?</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="answer : ${answers}">
                  <td th:text="${answer.id}">1</td>
                  <td th:text="${answer.content}">Đáp án</td>
                  <td>
                    <span class="badge" th:classappend="${answer.correct} ? 'text-bg-success' : 'text-bg-light text-dark'" th:text="${answer.correct ? 'Đúng' : 'Không'}">Không</span>
                  </td>
                  <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/answers/{id}/edit(id=${answer.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/admin/answers/{id}/delete(id=${answer.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa đáp án này?');">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(answers)}">
                  <td colspan="4" class="text-center text-muted">Câu hỏi này chưa có đáp án.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
