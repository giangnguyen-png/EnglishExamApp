<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${formTitle}">Biểu mẫu câu hỏi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar(${formTitle})}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4">
          <div class="mb-3">
            <div class="text-muted small">Phần thi</div>
            <div class="fw-semibold">
              <span th:text="${section.skillType}">READING</span>
              <span class="text-muted">in</span>
              <span th:text="${section.exam.title}">Đề thi</span>
            </div>
          </div>
          <form th:action="${actionUrl}" th:object="${questionForm}" method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="questionType">Loại câu hỏi</label>
                <select class="form-select" id="questionType" th:field="*{questionType}" required>
                  <option th:each="type : ${questionTypes}" th:value="${type}" th:text="${type}">SINGLE_CHOICE</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label" for="points">Điểm</label>
                <input class="form-control" id="points" type="number" step="0.5" th:field="*{points}" required>
              </div>
              <div class="col-md-3">
                <label class="form-label" for="orderIndex">Thứ tự câu hỏi</label>
                <input class="form-control" id="orderIndex" type="number" th:field="*{orderIndex}" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="content">Nội dung câu hỏi</label>
                <textarea class="form-control" id="content" rows="5" th:field="*{content}" required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="imageUrl">URL hình ảnh</label>
                <input class="form-control" id="imageUrl" th:field="*{imageUrl}">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="durationSeconds">Tổng thời gian câu hỏi (giây)</label>
                <input class="form-control" id="durationSeconds" type="number" th:field="*{durationSeconds}">
                <div class="form-text">Chỉ áp dụng cho câu hỏi Speaking.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="preparationSeconds">Thời gian chuẩn bị (giây)</label>
                <input class="form-control" id="preparationSeconds" type="number" th:field="*{preparationSeconds}">
                <div class="form-text">Chỉ áp dụng cho câu hỏi Speaking.</div>
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button class="btn btn-primary" type="submit">Lưu</button>
              <a class="btn btn-outline-secondary" th:href="@{/admin/sections/{id}/questions(id=${section.id})}">Hủy</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
