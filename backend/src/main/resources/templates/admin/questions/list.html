<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câu hỏi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('exams')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Câu hỏi')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-muted small">Phần thi</div>
              <h2 class="h5 mb-0">
                <span th:text="${section.skillType}">READING</span>
                <span class="text-muted">#</span><span th:text="${section.sectionOrder}">1</span>
              </h2>
            </div>
            <div class="d-flex gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/admin/exams/{id}(id=${section.exam.id})}">Quay lại</a>
              <a class="btn btn-primary" th:href="@{/admin/sections/{id}/questions/new(id=${section.id})}">Thêm câu hỏi</a>
            </div>
          </div>
        </section>

        <section class="admin-card p-3">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Thứ tự</th>
                  <th>Loại</th>
                  <th>Nội dung</th>
                  <th>Hình ảnh</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="question : ${questions}">
                  <td th:text="${question.orderIndex}">1</td>
                  <td><span class="badge text-bg-secondary" th:text="${question.questionType}">SINGLE_CHOICE</span></td>
                  <td class="text-truncate" style="max-width: 460px;" th:text="${question.content}">Câu hỏi</td>
                  <td>
                    <img class="thumb" th:if="${question.imageUrl}" th:src="${question.imageUrl}" alt="Hình câu hỏi">
                    <span th:unless="${question.imageUrl}" class="text-muted">-</span>
                  </td>
                  <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/questions/{id}(id=${question.id})}">Xem</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/questions/{id}/edit(id=${question.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/admin/questions/{id}/delete(id=${question.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa câu hỏi này?');">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(questions)}">
                  <td colspan="5" class="text-center text-muted">Không có câu hỏi.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
