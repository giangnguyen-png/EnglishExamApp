<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ca thi thử</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('mockSessions')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Ca thi thử')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-3">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Mã phòng</th>
                  <th>Giám khảo</th>
                  <th>Đề thi</th>
                  <th>Thời gian bắt đầu</th>
                  <th>Hạn đăng ký</th>
                  <th>Trạng thái</th>
                  <th>Thí sinh</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="mockSession : ${sessions}">
                  <td th:text="${mockSession.id}">1</td>
                  <td th:text="${mockSession.roomCode}">ROOM</td>
                  <td th:text="${mockSession.expert != null ? mockSession.expert.username : '-'}">expert</td>
                  <td th:text="${mockSession.exam != null ? mockSession.exam.title : '-'}">exam</td>
                  <td th:text="${mockSession.startTime != null ? #temporals.format(mockSession.startTime, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                  <td th:text="${mockSession.registrationDeadline != null ? #temporals.format(mockSession.registrationDeadline, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                  <td>
                    <span class="badge"
                      th:classappend="${mockSession.status.name() == 'COMPLETED'} ? 'text-bg-secondary' : (${mockSession.status.name() == 'ONGOING'} ? 'text-bg-success' : 'text-bg-warning')"
                      th:text="${mockSession.status.name() == 'PENDING' ? 'Chờ bắt đầu' : (mockSession.status.name() == 'ONGOING' ? 'Đang diễn ra' : 'Đã hoàn thành')}">Chờ bắt đầu</span>
                  </td>
                  <td>
                    <span th:text="${mockSession.sessionRegistrations != null ? mockSession.sessionRegistrations.size() : 0}">0</span>
                    <span class="text-muted">/</span>
                    <span th:text="${mockSession.maxCandidates}">0</span>
                  </td>
                  <td class="text-end">
                    <form class="d-inline"
                      th:if="${(mockSession.sessionRegistrations == null || mockSession.sessionRegistrations.size() == 0) && (mockSession.testAttempts == null || mockSession.testAttempts.size() == 0)}"
                      th:action="@{/admin/mock-sessions/{id}/delete(id=${mockSession.id})}"
                      method="post"
                      onsubmit="return confirm('Bạn có chắc muốn xóa ca thi thử này?');">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(sessions)}">
                  <td colspan="9" class="text-center text-muted">Không có ca thi thử.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
