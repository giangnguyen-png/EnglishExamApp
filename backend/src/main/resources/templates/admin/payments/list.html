<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh toán</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('payments')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Thanh toán')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-3">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Người dùng</th>
                  <th>Số tiền</th>
                  <th>Phương thức thanh toán</th>
                  <th>Mã giao dịch</th>
                  <th>Trạng thái</th>
                  <th>Ngày tạo</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="payment : ${payments}">
                  <td th:text="${payment.id}">1</td>
                  <td th:text="${payment.user != null ? payment.user.username : '-'}">user</td>
                  <td th:text="${payment.amount}">0</td>
                  <td th:text="${payment.paymentMethod}">FAKE</td>
                  <td th:text="${payment.transactionId}">txn</td>
                  <td>
                    <span class="badge"
                      th:classappend="${payment.status.name() == 'SUCCESS'} ? 'text-bg-success' : (${payment.status.name() == 'PENDING'} ? 'text-bg-warning' : 'text-bg-danger')"
                      th:text="${payment.status.name() == 'SUCCESS' ? 'Thành công' : (payment.status.name() == 'PENDING' ? 'Đang chờ' : 'Thất bại')}">Thành công</span>
                  </td>
                  <td th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}">
                  <td colspan="7" class="text-center text-muted">Không có thanh toán.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
