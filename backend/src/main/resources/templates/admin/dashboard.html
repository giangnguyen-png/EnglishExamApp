<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('dashboard')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Tổng quan')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="admin-card summary-card p-3">
              <div class="text-muted">Tổng người dùng</div>
              <div class="display-6 fw-bold" th:text="${userCount}">0</div>
              <a th:href="@{/admin/users}" class="small">Xem người dùng</a>
            </div>
          </div>
          <div class="col-md-3">
            <div class="admin-card summary-card p-3">
              <div class="text-muted">Tổng đề thi</div>
              <div class="display-6 fw-bold" th:text="${examCount}">0</div>
              <a th:href="@{/admin/exams}" class="small">Quản lý đề thi</a>
            </div>
          </div>
          <div class="col-md-3">
            <div class="admin-card summary-card p-3">
              <div class="text-muted">Tổng ca thi thử</div>
              <div class="display-6 fw-bold" th:text="${mockSessionCount}">0</div>
              <a th:href="@{/admin/mock-sessions}" class="small">Xem ca thi</a>
            </div>
          </div>
          <div class="col-md-3">
            <div class="admin-card summary-card p-3">
              <div class="text-muted">Tổng thanh toán</div>
              <div class="display-6 fw-bold" th:text="${paymentCount}">0</div>
              <div class="small text-success" th:text="${successPaymentTotal}">0</div>
            </div>
          </div>
        </div>

        <section class="admin-card p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Thanh toán gần đây</h2>
            <a th:href="@{/admin/payments}" class="btn btn-sm btn-outline-primary">Xem tất cả</a>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Người dùng</th>
                  <th>Số tiền</th>
                  <th>Trạng thái</th>
                  <th>Ngày tạo</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="payment : ${recentPayments}">
                  <td th:text="${payment.id}">1</td>
                  <td th:text="${payment.user != null ? payment.user.username : '-'}">user</td>
                  <td th:text="${payment.amount}">0</td>
                  <td>
                    <span class="badge"
                      th:classappend="${payment.status.name() == 'SUCCESS'} ? 'text-bg-success' : (${payment.status.name() == 'PENDING'} ? 'text-bg-warning' : 'text-bg-danger')"
                      th:text="${payment.status.name() == 'SUCCESS' ? 'Thành công' : (payment.status.name() == 'PENDING' ? 'Đang chờ' : 'Thất bại')}">Thành công</span>
                  </td>
                  <td th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentPayments)}">
                  <td colspan="5" class="text-center text-muted">Chưa có thanh toán.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
