<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('users')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Chi tiết người dùng')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0" th:text="${user.username}">username</h2>
            <div class="d-flex gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Quay lại</a>
              <a class="btn btn-primary" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Sửa</a>
              <form th:if="${user.role == null || user.role.name != 'ADMIN'}"
                th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                method="post"
                onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này và toàn bộ dữ liệu liên quan?');">
                <button class="btn btn-outline-danger" type="submit">Xóa</button>
              </form>
            </div>
          </div>
          <dl class="row mb-0">
            <dt class="col-sm-3">Họ tên</dt><dd class="col-sm-9" th:text="${user.fullName}">Họ tên</dd>
            <dt class="col-sm-3">Email</dt><dd class="col-sm-9" th:text="${user.email}">email</dd>
            <dt class="col-sm-3">Vai trò</dt><dd class="col-sm-9"><span class="badge text-bg-secondary" th:text="${user.role != null ? (user.role.name == 'ADMIN' ? 'Quản trị viên' : (user.role.name == 'EXPERT' ? 'Giám khảo' : 'Người dùng')) : '-'}">Người dùng</span></dd>
            <dt class="col-sm-3">Ngày tạo</dt><dd class="col-sm-9" th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</dd>
            <dt class="col-sm-3">Lượt làm bài</dt><dd class="col-sm-9" th:text="${attemptCount}">0</dd>
            <dt class="col-sm-3">Lượt đăng ký ca thi</dt><dd class="col-sm-9" th:text="${registrationCount}">0</dd>
          </dl>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
