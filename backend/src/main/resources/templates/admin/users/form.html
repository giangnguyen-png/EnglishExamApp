<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chỉnh sửa người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('users')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Chỉnh sửa người dùng')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-4">
          <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${userForm}" method="post">
            <div class="mb-3">
              <label class="form-label" for="username">Tên đăng nhập</label>
              <input class="form-control" id="username" th:field="*{username}" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" type="email" th:field="*{email}" required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="roleId">Vai trò</label>
              <select class="form-select" id="roleId" th:field="*{roleId}" th:disabled="${isSelf}" required>
                <option th:each="role : ${roles}"
                  th:value="${role.id}"
                  th:text="${role.name == 'ADMIN' ? 'Quản trị viên' : (role.name == 'EXPERT' ? 'Giám khảo' : 'Người dùng')}">Người dùng</option>
              </select>
              <input type="hidden" th:if="${isSelf}" th:field="*{roleId}">
              <div class="form-text" th:if="${isSelf}">Bạn không thể thay đổi vai trò của chính mình.</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
              <a class="btn btn-outline-secondary" th:href="@{/admin/users/{id}(id=${user.id})}">Hủy</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
