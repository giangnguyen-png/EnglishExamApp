<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/admin/admin.css}" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('users')}"></div>
    <main class="admin-main">
      <div th:replace="~{admin/fragments/navbar :: navbar('Người dùng')}"></div>
      <div class="content-wrap">
        <div th:replace="~{admin/fragments/messages :: messages}"></div>
        <section class="admin-card p-3">
          <form class="row g-2 mb-3" th:action="@{/admin/users}" method="get">
            <div class="col-md-10">
              <input class="form-control" name="q" th:value="${query}" placeholder="Tìm theo tên đăng nhập, email hoặc họ tên">
            </div>
            <div class="col-md-2 d-grid">
              <button class="btn btn-primary" type="submit">Tìm kiếm</button>
            </div>
          </form>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên đăng nhập</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Ngày tạo</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="user : ${users}">
                  <td th:text="${user.id}">1</td>
                  <td th:text="${user.username}">username</td>
                  <td th:text="${user.email}">email</td>
                  <td><span class="badge text-bg-secondary" th:text="${user.role != null ? (user.role.name == 'ADMIN' ? 'Quản trị viên' : (user.role.name == 'EXPERT' ? 'Giám khảo' : 'Người dùng')) : '-'}">Người dùng</span></td>
                  <td th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                  <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}(id=${user.id})}">Xem</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Sửa</a>
                    <form class="d-inline"
                      th:if="${user.role == null || user.role.name != 'ADMIN'}"
                      th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                      method="post"
                      onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này và toàn bộ dữ liệu liên quan?');">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                  <td colspan="6" class="text-center text-muted">Không tìm thấy người dùng.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
